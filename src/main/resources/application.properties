server.port=${PORT:8080}
spring.application.name=smart-rental-backend

# H2 is the local default; set SPRING_DATASOURCE_URL for PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_rental;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT Authentication
app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-this-key-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
```

